name: Publish v1.2.8

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

env:
  VERIFIED_SOURCE_SHA: cceefc0f7b6bccc02774762f6c11b60308ceed6e
  VERIFIED_APK_SHA256: 0d08277ed579d5aa20a3a5cb304f75ee46f87a921870a4a5347d9c210bf6eb48
  RELEASE_TARGET_SHA: 6987a5435c60b28e5b2a9aa21fffd0aa56afad62
  RELEASE_PR: "11"

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release v1.2.8')
    runs-on: ubuntu-latest
    steps:
      - name: Download verified PR APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_ID="$(gh run list \
            --commit "$VERIFIED_SOURCE_SHA" \
            --workflow "Android CI" \
            --event pull_request \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Android CI run found for $VERIFIED_SOURCE_SHA" >&2
            exit 1
          fi

          mkdir -p release-artifact
          gh run download "$RUN_ID" \
            --name chzzk-sleep-timer-debug \
            --dir release-artifact

          test -f release-artifact/app-debug.apk
          cp release-artifact/app-debug.apk chzzk-sleep-timer-v1.2.8.apk

          ACTUAL_SHA256="$(sha256sum chzzk-sleep-timer-v1.2.8.apk | cut -d' ' -f1)"
          if [ "$ACTUAL_SHA256" != "$VERIFIED_APK_SHA256" ]; then
            echo "APK checksum mismatch: $ACTUAL_SHA256" >&2
            exit 1
          fi

          sha256sum chzzk-sleep-timer-v1.2.8.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'EOF'
          ## v1.2.8

          수면 타이머의 기능 확장과 실제 취침 환경에서의 안정성을 정리한 릴리즈입니다.

          ### 주요 기능
          - 매일 지정 시각 종료 및 15/30/60/90분·사용자 지정 일회성 타이머
          - 상단 고정 알림에서 실제 다음 종료까지 실시간 카운트다운
          - 알림에서 `+20분`, `연장`, `밝기` 빠른 제어
          - 종료 10분 전 작은 경고 팝업과 +5 / +20 / +40분 오늘만 연장
          - 종료 30초 전 미디어 볼륨 부드러운 페이드아웃
          - 시스템 최저 밝기보다 더 어둡게 만드는 Extra Dim 오버레이
          - 예약 종료 후 Extra Dim 자동 해제
          - 미디어 일시정지 / 음량 0 / 화면 잠금 동작 개별 선택

          ### v1.2.8 안정화
          - 10분 전 경고 알림과 페이드아웃 알림의 ID 충돌 수정
          - 화면이 이미 꺼져 있으면 10분 전 경고가 화면을 다시 켜지 않도록 수정
          - Android 14+ 전체 화면 알림 허용 여부 확인 및 안전한 fallback
          - 화면이 이미 꺼진 상태에서 종료돼도 Extra Dim이 다음 아침까지 남지 않도록 수정
          - 매일 예약과 일회성 타이머가 동시에 있을 때 실제로 먼저 종료되는 타이머를 상단 카운트다운에 표시
          - 상단 연장 버튼이 현재 표시 중인 실제 다음 타이머를 연장하도록 수정
          - 일회성 타이머 종료/취소 후 카운트다운 즉시 재동기화
          - 페이드아웃 서비스 비정상 종료 시 원래 볼륨 및 내부 상태 복구
          - 겹치는 예약에 대한 회귀 테스트 추가

          ### 검증
          첨부 APK는 PR #11에서 unit test, Android lint, assembleDebug를 모두 통과한 동일한 GitHub Actions artifact입니다. 게시 단계에서도 SHA-256 고정값을 다시 대조하며 `SHA256SUMS.txt`를 함께 제공합니다.

          ### APK 서명 안내
          현재 APK는 debug 서명 빌드입니다. 서로 다른 CI 실행에서 생성한 APK는 서명이 다를 수 있으므로 기존 버전 위에 업데이트 설치가 거부되면 기존 앱을 제거한 후 설치해야 할 수 있습니다.
          EOF

          if gh release view v1.2.8 >/dev/null 2>&1; then
            gh release edit v1.2.8 \
              --target "$RELEASE_TARGET_SHA" \
              --title "v1.2.8" \
              --notes-file release-notes.md \
              --latest
            gh release upload v1.2.8 \
              chzzk-sleep-timer-v1.2.8.apk \
              SHA256SUMS.txt \
              --clobber
          else
            gh release create v1.2.8 \
              chzzk-sleep-timer-v1.2.8.apk \
              SHA256SUMS.txt \
              --target "$RELEASE_TARGET_SHA" \
              --title "v1.2.8" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Record publication on release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr comment "$RELEASE_PR" --body "✅ v1.2.8 GitHub Release 게시 완료 · APK SHA-256: \`$VERIFIED_APK_SHA256\`"

name: Publish v1.2.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

env:
  VERIFIED_SOURCE_SHA: db779bd3dd78ef292de9d2dde32e0a2d5a9efbc8
  VERIFIED_APK_SHA256: 98f61c33c07435a036c8c7f66ed0ec2f5aba50b27495420f09b5106a85c49174
  RELEASE_PR: "3"

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release v1.2.0')
    runs-on: ubuntu-latest
    steps:
      - name: Download verified PR APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_ID="$(gh run list \
            --commit "$VERIFIED_SOURCE_SHA" \
            --workflow "Android CI" \
            --event pull_request \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Android CI run found for $VERIFIED_SOURCE_SHA" >&2
            exit 1
          fi

          mkdir -p release-artifact
          gh run download "$RUN_ID" \
            --name chzzk-sleep-timer-debug \
            --dir release-artifact

          test -f release-artifact/app-debug.apk
          cp release-artifact/app-debug.apk chzzk-sleep-timer-v1.2.0.apk

          ACTUAL_SHA256="$(sha256sum chzzk-sleep-timer-v1.2.0.apk | cut -d' ' -f1)"
          if [ "$ACTUAL_SHA256" != "$VERIFIED_APK_SHA256" ]; then
            echo "APK checksum mismatch: $ACTUAL_SHA256" >&2
            exit 1
          fi

          sha256sum chzzk-sleep-timer-v1.2.0.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'EOF'
          ## v1.2.0

          수면 타이머를 실제 사용 흐름에 맞게 전반적으로 개선한 릴리즈입니다.

          ### 주요 변경
          - 15/30/60/90분 빠른 일회성 타이머 추가
          - 1~1440분 사용자 지정 일회성 타이머 추가
          - 매일 예약과 일회성 예약을 독립적으로 동시 유지
          - 미디어 일시정지 / 음량 0 / 화면 잠금 실행 동작 개별 선택
          - 재부팅, 시간/시간대 변경, 앱 업데이트, 정확한 알람 권한 변경 후 예약 복구
          - 늦게 전달되는 근사 알람을 앱 재실행이 덮어쓰지 않도록 보호
          - v1.1 구형 예약 PendingIntent 자동 정리
          - 실제 다음 실행 시각, 남은 시간, 정확/근사 알람 상태 표시
          - 최근 실행 경로와 결과 표시
          - Android 15 시스템 바/edge-to-edge 대응
          - 접근성 및 권한 안내 UX 개선
          - 스케줄 계산 단위 테스트와 CI 검증 추가

          ### 검증
          첨부 APK는 릴리즈 PR에서 단위 테스트, Android lint, assembleDebug를 모두 통과한 동일한 CI artifact입니다. 게시 단계에서도 SHA-256을 고정값과 대조하며 `SHA256SUMS.txt`를 함께 제공합니다.

          ### APK 서명 안내
          이 저장소에는 배포용 keystore를 저장하지 않습니다. 첨부 APK는 설치 가능한 debug 서명 빌드입니다. 다른 CI 실행에서 생성한 APK와 서명이 다를 수 있으므로 기존 CI APK 위에 업데이트 설치가 되지 않으면 기존 앱을 제거한 뒤 설치해야 합니다.
          EOF

          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh release edit v1.2.0 \
              --title "v1.2.0" \
              --notes-file release-notes.md \
              --latest
            gh release upload v1.2.0 \
              chzzk-sleep-timer-v1.2.0.apk \
              SHA256SUMS.txt \
              --clobber
          else
            gh release create v1.2.0 \
              chzzk-sleep-timer-v1.2.0.apk \
              SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "v1.2.0" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Record publication on release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr comment "$RELEASE_PR" --body "✅ v1.2.0 GitHub Release 게시 완료 · APK SHA-256: \`$VERIFIED_APK_SHA256\`"

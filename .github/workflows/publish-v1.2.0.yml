name: Publish v1.2.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release v1.2.0')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify and build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Prepare release assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk chzzk-sleep-timer-v1.2.0.apk
          sha256sum chzzk-sleep-timer-v1.2.0.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## v1.2.0

          수면 타이머를 실제 사용 흐름에 맞게 전반적으로 개선한 릴리즈입니다.

          ### 주요 변경
          - 15/30/60/90분 빠른 일회성 타이머 추가
          - 1~1440분 사용자 지정 일회성 타이머 추가
          - 매일 예약과 일회성 예약을 독립적으로 동시 유지
          - 미디어 일시정지 / 음량 0 / 화면 잠금 실행 동작 개별 선택
          - 재부팅, 시간/시간대 변경, 앱 업데이트, 정확한 알람 권한 변경 후 예약 복구
          - 실제 다음 실행 시각, 남은 시간, 정확/근사 알람 상태 표시
          - 최근 실행 경로와 결과 표시
          - Android 15 시스템 바/edge-to-edge 대응
          - 접근성 및 권한 안내 UX 개선
          - 스케줄 계산 단위 테스트와 CI 검증 추가

          ### APK 서명 안내
          이 저장소에는 배포용 keystore를 저장하지 않습니다. 첨부 APK는 설치 가능한 debug 서명 빌드입니다. 다른 CI 실행에서 생성한 APK와 서명이 다를 수 있으므로 기존 CI APK 위에 업데이트 설치가 되지 않으면 기존 앱을 제거한 뒤 설치해야 합니다.
          EOF

          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh release upload v1.2.0 chzzk-sleep-timer-v1.2.0.apk SHA256SUMS.txt --clobber
          else
            gh release create v1.2.0 \
              chzzk-sleep-timer-v1.2.0.apk \
              SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "v1.2.0" \
              --notes-file release-notes.md \
              --latest
          fi
